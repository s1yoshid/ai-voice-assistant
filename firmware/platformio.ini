[env:m5stack-atom-echo]
; Use the community-maintained PioArduino fork instead of the locked 2.x core
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

; Specify the exact ESP32-PICO hardware variant used by the Atom Echo
board = pico32

; Monitor speed typically used by M5Stack devices
monitor_speed = 115200

; FIX FOR WSL USB DROPS: Force a standard, un-throttled baud rate
upload_speed = 115200

; FIX FOR TIMING/RESET SCRAPES: Forces proper bootloader entry sequence over virtual USB
upload_resetmethod = nodemcu

; Automatically fetch the M5Unified library from the PlatformIO registry
lib_deps =
    m5stack/M5Unified
    fastled/FastLED@^3.10.3